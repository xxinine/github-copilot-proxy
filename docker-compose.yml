services:
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    env_file: .env
    environment:
      CPX_DB_PATH: /app/data/cpx.db
    ports:
      - "${CPX_CONTROL_PLANE_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile.mt
    env_file: .env
    environment:
      CPX_DB_PATH: /app/data/cpx.db
      CPX_PROXY_PORT: 4141
    ports:
      # Unified public API endpoint (same for every user).
      - "${CPX_GATEWAY_PORT:-4000}:4141"
    volumes:
      # Shared SQLite DB written by the control-plane.
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - control-plane

